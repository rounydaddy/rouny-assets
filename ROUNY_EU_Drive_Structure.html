<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROUNY EU · Google Drive 文件架构</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --navy:   #1C3454;
  --navy2:  #162840;
  --navy3:  #0d1e2e;
  --pine:   #5F8575;
  --sky:    #A0BECD;
  --orange: #EB974E;
  --warm:   #E6E1DC;
  --cream:  #F5F1EB;
  --white:  #ffffff;

  /* folder type colors */
  --c-brand:   #EB974E;
  --c-product: #A0BECD;
  --c-market:  #5F8575;
  --c-content: #b09ec9;
  --c-ops:     #e0857a;
  --c-ai:      #78BEAF;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--navy3);
  color: var(--white);
  line-height: 1.6;
}

/* ── HEADER ── */
.page-header {
  background: var(--navy2);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  padding: 40px 60px 36px;
  display: flex; justify-content: space-between; align-items: flex-end;
}
.ph-left .eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 3px;
  color: var(--orange); text-transform: uppercase;
  margin-bottom: 10px;
}
.ph-left h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 36px; line-height: 1.1;
}
.ph-left h1 em { color: var(--orange); font-style: italic; }
.ph-left .subtitle {
  margin-top: 8px; font-size: 13px;
  color: rgba(255,255,255,0.45); font-weight: 300;
}
.ph-stats {
  display: flex; gap: 24px;
}
.stat {
  text-align: right;
}
.stat .num {
  font-family: 'DM Serif Display', serif;
  font-size: 32px; color: var(--orange);
}
.stat .lbl {
  font-size: 10px; font-family: 'DM Mono', monospace;
  color: rgba(255,255,255,0.3); letter-spacing: 2px;
  text-transform: uppercase;
}

/* ── LEGEND ── */
.legend-bar {
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding: 14px 60px;
  display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
}
.legend-item {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; font-family: 'DM Mono', monospace;
  color: rgba(255,255,255,0.5);
}
.legend-dot {
  width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0;
}
.legend-sep { color: rgba(255,255,255,0.1); }

/* ── LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  min-height: calc(100vh - 160px);
}

/* ── LEFT: TREE ── */
.tree-panel {
  background: var(--navy2);
  border-right: 1px solid rgba(255,255,255,0.06);
  padding: 28px 0 40px;
  overflow-y: auto;
  position: sticky; top: 0; height: calc(100vh - 130px);
}

.tree-search {
  margin: 0 20px 20px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 8px 14px;
  display: flex; align-items: center; gap: 8px;
}
.tree-search input {
  background: none; border: none; outline: none;
  font-family: 'DM Mono', monospace; font-size: 12px;
  color: var(--white); width: 100%;
}
.tree-search input::placeholder { color: rgba(255,255,255,0.25); }

.tree-root {
  padding: 0 16px 0 20px;
}

/* Folder items */
.f-item {
  cursor: pointer;
  user-select: none;
}

.f-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 6px;
  transition: background 0.15s;
  white-space: nowrap; overflow: hidden;
}
.f-row:hover { background: rgba(255,255,255,0.06); }
.f-row.active { background: rgba(235,151,78,0.12); }

.f-indent { width: 16px; flex-shrink: 0; }
.f-toggle {
  width: 14px; text-align: center; flex-shrink: 0;
  font-size: 9px; color: rgba(255,255,255,0.3);
  transition: transform 0.2s;
}
.f-toggle.open { transform: rotate(90deg); }

.f-icon { font-size: 13px; flex-shrink: 0; }
.f-name {
  font-size: 12px; font-family: 'DM Mono', monospace;
  color: rgba(255,255,255,0.75);
  overflow: hidden; text-overflow: ellipsis;
}
.f-name.folder { color: rgba(255,255,255,0.9); font-weight: 500; }
.f-count {
  margin-left: auto; flex-shrink: 0;
  font-size: 9px; font-family: 'DM Mono', monospace;
  color: rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  padding: 1px 6px; border-radius: 10px;
}
.f-tag {
  margin-left: auto; flex-shrink: 0;
  font-size: 9px; font-family: 'DM Mono', monospace;
  padding: 1px 6px; border-radius: 3px;
  text-transform: uppercase; letter-spacing: 1px;
}

.f-children { display: none; }
.f-children.open { display: block; }

/* color tags */
.tag-brand   { background: rgba(235,151,78,0.2);  color: var(--c-brand); }
.tag-product { background: rgba(160,190,205,0.2); color: var(--c-product); }
.tag-market  { background: rgba(95,133,117,0.2);  color: var(--c-market); }
.tag-content { background: rgba(176,158,201,0.2); color: var(--c-content); }
.tag-ops     { background: rgba(224,133,122,0.2); color: var(--c-ops); }
.tag-ai      { background: rgba(120,190,175,0.2); color: var(--c-ai); }

/* color left-border on folder rows */
.fb-brand   { border-left: 2px solid var(--c-brand); }
.fb-product { border-left: 2px solid var(--c-product); }
.fb-market  { border-left: 2px solid var(--c-market); }
.fb-content { border-left: 2px solid var(--c-content); }
.fb-ops     { border-left: 2px solid var(--c-ops); }
.fb-ai      { border-left: 2px solid var(--c-ai); }

/* ── RIGHT: DETAIL PANEL ── */
.detail-panel {
  padding: 36px 50px;
  overflow-y: auto;
  max-height: calc(100vh - 130px);
}

.detail-panel h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 28px; margin-bottom: 6px;
}
.detail-panel .detail-path {
  font-family: 'DM Mono', monospace; font-size: 11px;
  color: var(--orange); margin-bottom: 24px;
}
.detail-panel .detail-desc {
  font-size: 14px; color: rgba(255,255,255,0.6);
  max-width: 660px; line-height: 1.8; margin-bottom: 32px;
  border-left: 2px solid rgba(255,255,255,0.1);
  padding-left: 16px;
}

/* File table */
.file-table {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.file-table thead tr {
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.file-table th {
  font-family: 'DM Mono', monospace; font-size: 10px;
  letter-spacing: 2px; text-transform: uppercase;
  color: rgba(255,255,255,0.3); font-weight: 400;
  padding: 0 0 12px; text-align: left;
}
.file-table td {
  padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  vertical-align: top;
}
.file-table tr:last-child td { border-bottom: none; }
.file-table tr:hover td { background: rgba(255,255,255,0.02); }

.td-icon { width: 36px; }
.td-name {
  font-family: 'DM Mono', monospace; font-size: 12px;
  color: var(--white); padding-right: 20px;
}
.td-ext {
  font-size: 10px; color: rgba(255,255,255,0.3);
  font-family: 'DM Mono', monospace;
}
.td-owner { width: 100px; font-size: 12px; color: rgba(255,255,255,0.4); }
.td-req { width: 80px; text-align: center; }
.td-req .req-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block;
}
.req-must  { background: var(--orange); }
.req-high  { background: var(--sky); }
.req-later { background: rgba(255,255,255,0.2); }
.td-desc { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.6; }

.req-legend {
  display: flex; gap: 20px; margin-bottom: 20px;
  font-size: 11px; font-family: 'DM Mono', monospace;
  color: rgba(255,255,255,0.4);
}
.req-legend-item { display: flex; align-items: center; gap: 6px; }

/* Section header inside detail */
.file-section {
  margin-top: 32px; margin-bottom: 12px;
  font-size: 10px; font-family: 'DM Mono', monospace;
  letter-spacing: 2px; text-transform: uppercase;
  color: rgba(255,255,255,0.25);
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

/* Empty state */
.empty-detail {
  padding: 60px 0; text-align: center;
  color: rgba(255,255,255,0.2); font-size: 14px;
}
.empty-detail .em-icon { font-size: 40px; margin-bottom: 12px; }

/* Responsive */
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .tree-panel { position: static; height: auto; max-height: 400px; }
  .detail-panel { max-height: none; }
  .page-header { padding: 28px 24px; flex-direction: column; gap: 20px; align-items: flex-start; }
  .legend-bar { padding: 14px 24px; }
}

/* ════════════════════════════════════════════
   WHITE THEME OVERRIDES
════════════════════════════════════════════ */
body { background: #F7F4EE !important; color: var(--navy) !important; }

/* Page header */
.page-header {
  background: #FFFFFF !important;
  border-bottom-color: rgba(28,52,84,0.1) !important;
}
.ph-left h1 { color: var(--navy) !important; }
.ph-left .subtitle { color: rgba(28,52,84,0.45) !important; }
.stat .lbl { color: rgba(28,52,84,0.32) !important; }

/* Legend bar */
.legend-bar {
  background: #FAFAF7 !important;
  border-bottom-color: rgba(28,52,84,0.07) !important;
}
.legend-item { color: rgba(28,52,84,0.52) !important; }
.legend-sep { color: rgba(28,52,84,0.15) !important; }
/* LATER dot override on light bg */
.req-later { background: rgba(28,52,84,0.2) !important; }

/* Tree panel */
.tree-panel {
  background: #FFFFFF !important;
  border-right-color: rgba(28,52,84,0.08) !important;
}
.tree-search {
  background: #F7F4EE !important;
  border-color: rgba(28,52,84,0.1) !important;
}
.tree-search > span { color: rgba(28,52,84,0.3) !important; }
.tree-search input { color: var(--navy) !important; }
.tree-search input::placeholder { color: rgba(28,52,84,0.25) !important; }
.f-row:hover { background: rgba(28,52,84,0.04) !important; }
.f-row.active { background: rgba(235,151,78,0.1) !important; }
.f-toggle { color: rgba(28,52,84,0.3) !important; }
.f-name { color: rgba(28,52,84,0.72) !important; }
.f-name.folder { color: rgba(28,52,84,0.9) !important; font-weight: 600 !important; }
.f-count {
  color: rgba(28,52,84,0.22) !important;
  background: rgba(28,52,84,0.05) !important;
}

/* Detail panel */
.detail-panel { background: #F7F4EE !important; }
.detail-panel h2 { color: var(--navy) !important; }
.detail-desc {
  color: rgba(28,52,84,0.62) !important;
  border-left-color: rgba(28,52,84,0.12) !important;
}

/* File table */
.file-table thead tr { border-bottom-color: rgba(28,52,84,0.1) !important; }
.file-table th { color: rgba(28,52,84,0.35) !important; }
.file-table td { border-bottom-color: rgba(28,52,84,0.05) !important; }
.file-table tr:hover td { background: rgba(28,52,84,0.02) !important; }
.td-name { color: var(--navy) !important; }
.td-ext { color: rgba(28,52,84,0.3) !important; }
.td-owner { color: rgba(28,52,84,0.42) !important; }
.td-desc { color: rgba(28,52,84,0.52) !important; }
.req-legend { color: rgba(28,52,84,0.4) !important; }
.file-section {
  color: rgba(28,52,84,0.28) !important;
  border-bottom-color: rgba(28,52,84,0.07) !important;
}
.empty-detail { color: rgba(28,52,84,0.2) !important; }

/* Subfolder preview cards in detail */
</style>
</head>
<body>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="ph-left">
    <div class="eyebrow">Project · ROUNY EU — Google Drive 文件架构 V1.0</div>
    <h1>数字资产<em>目录结构</em>与文件清单</h1>
    <div class="subtitle">点击左侧文件夹查看该目录下的完整文件清单与交付标准</div>
  </div>
  <div class="ph-stats">
    <div class="stat"><div class="num" id="totalFolders">—</div><div class="lbl">文件夹</div></div>

  </div>
</div>

<!-- LEGEND -->
<div class="legend-bar">
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-brand)"></div>品牌战略</div>
  <div class="legend-sep">·</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-product)"></div>产品资产</div>
  <div class="legend-sep">·</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-market)"></div>市场研究</div>
  <div class="legend-sep">·</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-content)"></div>内容营销</div>
  <div class="legend-sep">·</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-ops)"></div>电商运营</div>
  <div class="legend-sep">·</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-ai)"></div>AI 资产库</div>
  <div class="legend-sep">·</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--orange); border-radius:50%"></div>必须 MUST</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--sky); border-radius:50%"></div>重要 HIGH</div>
  <div class="legend-item"><div class="legend-dot" style="background:rgba(255,255,255,0.3); border-radius:50%"></div>后续 LATER</div>
</div>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- LEFT TREE -->
  <div class="tree-panel">
    <div class="tree-search">
      <span style="font-size:12px; color:rgba(28,52,84,0.3);">⌕</span>
      <input type="text" placeholder="搜索文件夹..." id="treeSearch" oninput="filterTree(this.value)">
    </div>
    <div class="tree-root" id="treeRoot"></div>
  </div>

  <!-- RIGHT DETAIL -->
  <div class="detail-panel" id="detailPanel">
    <div class="empty-detail">
      <div class="em-icon">📁</div>
      <p>点击左侧任意文件夹，查看文件清单</p>
    </div>
  </div>

</div>

<script>

   priority: must / high / later

══════════════════════════════════════════════ */

        { name: "ROUNY_Brand_Meeting_Record_0326",  ext: "md",  icon: "📝", owner: "维维", priority: "must", desc: "品牌探讨会议记录 0326 — 创始人意图最高优先级文件，品牌决策基准" },
        { name: "ROUNY_File_Naming_Convention",     ext: "md",  icon: "📋", owner: "团队", priority: "must", desc: "文件命名协议：全英文/无中文/下划线分隔/版本号规范，团队全员遵守" },
        { name: "ROUNY_Project_Changelog_V1",       ext: "md",  icon: "📋", owner: "维维", priority: "high", desc: "项目变更日志：品牌策略迭代记录，确保所有成员了解最新版本状态" },
        { name: "ROUNY_Folder_Access_Permission",   ext: "md",  icon: "🔐", owner: "维维", priority: "high", desc: "文件夹权限说明：各目录的查看/编辑权限分配（小桑/少杰/小鱼/外部合作方）" },

/* ══════════════════════════════════════════════
   BUILD TREE
══════════════════════════════════════════════ */
let selectedNode = null;
let allNodes = [];

function countAll(node) {
  let folders = 0, files = 0;
  if (node.children) {
    for (const c of node.children) {
      folders++;
      const r = countAll(c);
      folders += r.folders;
      files += r.files;
    }
  }
  if (node.files) files += node.files.length;
  return { folders, files };
}

function buildTree(node, depth = 0, parentEl) {
  const item = document.createElement('div');
  item.className = 'f-item';
  item.dataset.depth = depth;

  const row = document.createElement('div');
  row.className = 'f-row';
  if (node.color) row.classList.add('fb-' + node.color);

  // indent
  for (let i = 0; i < depth; i++) {
    const ind = document.createElement('div');
    ind.className = 'f-indent';
    row.appendChild(ind);
  }

  // toggle
  const toggle = document.createElement('div');
  toggle.className = 'f-toggle';
  if (node.children) toggle.textContent = '▶';
  row.appendChild(toggle);

  // icon
  const icon = document.createElement('span');
  icon.className = 'f-icon';
  icon.textContent = node.icon || '📁';
  row.appendChild(icon);

  // name
  const name = document.createElement('span');
  name.className = 'f-name folder';
  name.textContent = node.name;
  row.appendChild(name);

  // count or tag
  if (node.color) {
    const tag = document.createElement('span');
    tag.className = `f-tag tag-${node.color}`;
    tag.textContent = node.color === 'brand' ? 'BRAND' :
                      node.color === 'product' ? 'PROD' :
                      node.color === 'market' ? 'MKT' :
                      node.color === 'content' ? 'CNT' :
                      node.color === 'ops' ? 'OPS' : 'AI';
    row.appendChild(tag);
  }

  item.appendChild(row);

  // children container
  let childrenEl = null;
  if (node.children) {
    childrenEl = document.createElement('div');
    childrenEl.className = 'f-children';
    node.children.forEach(child => buildTree(child, depth + 1, childrenEl));
    item.appendChild(childrenEl);
  }

  // click
  row.addEventListener('click', () => {
    // deselect all
    document.querySelectorAll('.f-row.active').forEach(r => r.classList.remove('active'));
    row.classList.add('active');

    // toggle children
    if (childrenEl) {
      const isOpen = childrenEl.classList.contains('open');
      childrenEl.classList.toggle('open', !isOpen);
      toggle.classList.toggle('open', !isOpen);
    }

    showDetail(node);
  });

  allNodes.push({ node, row, item });
  parentEl.appendChild(item);
}

function showDetail(node) {
  const panel = document.getElementById('detailPanel');

  let html = `
    <div class="detail-path">ROUNY_EU_Project_V1/ › ${node.name}/</div>
    <h2>${node.icon || '📁'} ${node.name}</h2>
    <p class="detail-desc">${node.desc || ''}</p>
  `;

  if (node.files && node.files.length > 0) {
    html += `
      <div class="req-legend">
        <div class="req-legend-item"><div class="req-dot req-must"></div> MUST — 必须交付</div>
        <div class="req-legend-item"><div class="req-dot req-high"></div> HIGH — 重要，尽快</div>
        <div class="req-legend-item"><div class="req-dot req-later"></div> LATER — 后续补充</div>
      </div>
      <div class="file-section">${node.files.length} 个文件 · 点击行查看描述</div>
      <table class="file-table">
        <thead>
          <tr>
            <th class="td-icon"></th>
            <th>文件名</th>
            <th class="td-owner">负责人</th>
            <th class="td-req">优先级</th>
            <th>说明</th>
          </tr>
        </thead>
        <tbody>
    `;

    node.files.forEach(f => {
      html += `
        <tr>
          <td class="td-icon">${f.icon}</td>
          <td class="td-name">${f.name}<br><span class="td-ext">.${f.ext}</span></td>
          <td class="td-owner">${f.owner}</td>
          <td class="td-req"><div class="req-dot req-${f.priority}" title="${f.priority.toUpperCase()}"></div></td>
          <td class="td-desc">${f.desc}</td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
  }

  if (node.children && node.children.length > 0) {
    html += `<div class="file-section" style="margin-top:${node.files ? '32px' : '0'};">${node.children.length} 个子文件夹</div>`;
    node.children.forEach(c => {
      const fileCount = c.files ? c.files.length : 0;
      html += `
        <div style="
          display:flex; align-items:flex-start; gap:14px;
          padding:14px 16px; border:1px solid rgba(28,52,84,0.08);
          border-radius:8px; margin-bottom:8px;
          background:#FFFFFF;
        ">
          <span style="font-size:20px;">${c.icon || '📁'}</span>
          <div>
            <div style="font-family:'DM Mono',monospace; font-size:12px; color:rgba(28,52,84,0.85); margin-bottom:4px;">${c.name}/</div>
            <div style="font-size:12px; color:rgba(28,52,84,0.45); line-height:1.6;">${c.desc ? c.desc.slice(0,100) + '…' : ''}</div>
            ${fileCount ? `<div style="font-size:10px; color:var(--sky); font-family:'DM Mono',monospace; margin-top:6px;">${fileCount} 个文件</div>` : ''}
          </div>
        </div>
      `;
    });
  }

  if (!node.files && !node.children) {
    html += `<div class="empty-detail"><div class="em-icon">📂</div><p>此文件夹暂无文件定义</p></div>`;
  }

  panel.innerHTML = html;
}

/* ══════════════════════════════════════════════
   FILTER
══════════════════════════════════════════════ */
function filterTree(query) {
  const q = query.toLowerCase().trim();
  allNodes.forEach(({ node, row, item }) => {
    if (!q) {
      item.style.display = '';
      return;
    }
    const match = node.name.toLowerCase().includes(q) ||
                  (node.desc && node.desc.toLowerCase().includes(q));
    item.style.display = match ? '' : 'none';
  });
}

   INIT

// Stats

document.getElementById('totalFolders').textContent = stats.folders + (DRIVE.children.length);

    name: 'ROUNY_EU_Project_V1',

    children: DRIVE.children
  });
});

if (DRIVE.children[0]) {
  const first = allNodes[0];
  if (first) {
    first.row.classList.add('active');
    showDetail(first.node);
  }
}
